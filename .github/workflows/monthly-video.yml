name: Render monthly video

on:
  schedule:
    - cron: "17 6 2 * *"
  workflow_dispatch:
    inputs:
      month:
        description: "Month to render (YYYY-MM); blank means previous month"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: monthly-radar-video
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Select month
        id: month
        shell: bash
        env:
          REQUESTED_MONTH: ${{ inputs.month }}
        run: |
          set -euo pipefail
          if [[ -n "${REQUESTED_MONTH:-}" ]]; then
            month="$REQUESTED_MONTH"
          else
            month="$(date -u -d 'last month' +%Y-%m)"
          fi
          if [[ ! "$month" =~ ^[0-9]{4}-[0-9]{2}$ ]]; then
            echo "Invalid month: $month" >&2
            exit 2
          fi
          echo "month=$month" >> "$GITHUB_OUTPUT"

      - name: Download and unpack raw observations
        shell: bash
        env:
          MONTH: ${{ steps.month.outputs.month }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/archives" "$RUNNER_TEMP/raw"
          gh release download "data-$MONTH" --pattern "radar-$MONTH-*.tar.gz" --dir "$RUNNER_TEMP/archives"
          find "$RUNNER_TEMP/archives" -name '*.tar.gz' -print0 | while IFS= read -r -d '' archive; do
            tar -xzf "$archive" -C "$RUNNER_TEMP/raw"
          done

      - name: Render and validate MP4
        shell: bash
        env:
          MONTH: ${{ steps.month.outputs.month }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/video"
          python -m prague_rain_radar.render \
            --input-dir "$RUNNER_TEMP/raw" \
            --month "$MONTH" \
            --output "$RUNNER_TEMP/video/prague-radar-$MONTH-${GITHUB_RUN_ID}.mp4"

      - name: Publish new film, then remove the old one
        shell: bash
        env:
          MONTH: ${{ steps.month.outputs.month }}
        run: |
          set -euo pipefail
          release="latest-video"
          video="$RUNNER_TEMP/video/prague-radar-$MONTH-${GITHUB_RUN_ID}.mp4"
          metadata="${video%.mp4}.json"
          name="$(basename "$video")"
          if ! gh release view "$release" >/dev/null 2>&1; then
            gh release create "$release" --title "Latest Prague radar video" --notes "The current monthly radar film. Source: CHMI Open Data, CC BY 4.0."
          fi

          gh release upload "$release" "$video" "$metadata"
          mkdir -p "$RUNNER_TEMP/verify"
          gh release download "$release" --pattern "$name" --dir "$RUNNER_TEMP/verify"
          test "$(sha256sum "$video" | cut -d' ' -f1)" = "$(sha256sum "$RUNNER_TEMP/verify/$name" | cut -d' ' -f1)"

          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$release" \
            --jq '.assets[] | [.id, .name] | @tsv' | while IFS=$'\t' read -r id old_name; do
              if [[ "$old_name" == *.mp4 && "$old_name" != "$name" ]]; then
                gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/$id"
              fi
              if [[ "$old_name" == *.json && "$old_name" != "${name%.mp4}.json" ]]; then
                gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/$id"
              fi
            done

          gh release edit "$release" --title "Prague radar video $MONTH" --notes "Rendered from 15-minute CHMI PseudoCAPPI 2 km observations. Data source: CHMI, CC BY 4.0. The previous film was deleted only after this upload passed checksum verification."

