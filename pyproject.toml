[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prague-rain-radar"
version = "1.0.0"
description = "Archive CHMI radar data around Prague and render monthly videos"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Michael Schnitzenbaumer"}]
dependencies = [
  "h5py>=3.10,<4",
  "numpy>=1.26,<3",
  "Pillow>=10,<13",
  "imageio-ffmpeg>=0.5,<1",
]

[project.scripts]
prague-radar-collect = "prague_rain_radar.collect:main"
prague-radar-render = "prague_rain_radar.render:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

